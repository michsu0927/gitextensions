[package]
name = "rgitext"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace]
members = ["git-core"]

[dependencies]
git-core = { path = "git-core" }
tauri = { version = "2.0.0", features = [] }
tauri-build = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rfd = "0.14"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
